name: Deploy demo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm test --prefix packages/aquadeck-skin
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Build independent challenge skins
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: |
          set -eu
          for skin in a b c; do
            npm ci --prefix "skins/$skin"
            npm test --prefix "skins/$skin" --if-present
            BASE_PATH="${BASE_PATH}skins/$skin/" npm run build --prefix "skins/$skin" -- --base "${BASE_PATH}skins/$skin/"
            mkdir -p "dist/skins/$skin"
            cp -a "skins/$skin/dist/." "dist/skins/$skin/"
          done
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
